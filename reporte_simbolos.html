<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte de tabla de símbolos</title>
<style>
body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
header { background: #1f3a5f; color: #fff; padding: 1rem 2rem; }
header h1 { margin: 0; font-size: 1.4rem; }
main { padding: 1.5rem 2rem; }
table { border-collapse: collapse; width: 100%%; background: #fff; }
th, td { border: 1px solid #d0d5da; padding: 8px 12px; text-align: left; }
th { background: #e8edf2; }
tr:nth-child(even) td { background: #f9fafb; }
.ok { color: #1a7f37; font-weight: bold; }

</style>
</head>
<body>
<header><h1>Reporte de tabla de símbolos</h1></header>
<main>
<table>

<tr><td>2</td><td>ventas</td><td>Variable declarada</td><td>analista</td><td>7</td></tr>
<tr><td>3</td><td>tendencias</td><td>Resultado de comando</td><td>analista</td><td>7</td></tr>
<tr><td>4</td><td>resumen</td><td>Resultado de comando</td><td>analista</td><td>8</td></tr>
</table>

</main>
</body>
</html>
